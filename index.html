<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나를 닮은 식물</title>

<!-- 카톡 공유 미리보기: 나중에 식물별 이미지 주소로 바꿉니다 -->
<meta property="og:title" content="내 띠로 보는 오늘의 운세와 나를 닮은 식물">
<meta property="og:description" content="출생연도만 고르면 바로 확인할 수 있어요.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<!-- 식물 그림은 한 번만 정의해 두고 카드에서 가져다 씁니다 (4종 × 물형/흙형 = 8개) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 식물 윗부분 -->
    <g id="g-monstera">
    <g fill="none" stroke="#3E7A52" stroke-width="2.5" stroke-linecap="round">
      <path d="M42 54 Q40 42 28 32"/><path d="M42 54 Q44 40 56 28"/><path d="M42 54 Q42 38 42 25"/>
    </g>
    <g transform="translate(27 29) rotate(-35) scale(1.05)"><path d="M0 -12 C-10 -6 -14 4 -7 9 C-3 12 0 8 0 5 C0 8 3 12 7 9 C14 4 10 -6 0 -12Z" fill="#2F7D4F"/></g>
    <g transform="translate(57 25) rotate(32) scale(1.05)"><path d="M0 -12 C-10 -6 -14 4 -7 9 C-3 12 0 8 0 5 C0 8 3 12 7 9 C14 4 10 -6 0 -12Z" fill="#3A9360"/></g>
    <g transform="translate(42 20) scale(1.2)"><path d="M0 -12 C-10 -6 -14 4 -7 9 C-3 12 0 8 0 5 C0 8 3 12 7 9 C14 4 10 -6 0 -12Z" fill="#2A6F46"/></g>
    </g>
    <g id="g-hanra">
    <g fill="none" stroke="#2F7048" stroke-width="3.2" stroke-linecap="round">
      <path d="M42 54 L18 36"/><path d="M42 54 L66 36"/><path d="M42 54 L25 22"/><path d="M42 54 L59 22"/>
      <path d="M42 54 L33 14"/><path d="M42 54 L51 14"/><path d="M42 54 L42 10"/>
    </g>
    </g>
    <g id="g-bamboo">
    <rect x="33" y="16" width="5" height="52" rx="2.5" fill="#5FA463"/>
    <rect x="40" y="8" width="5" height="60" rx="2.5" fill="#4E9456"/>
    <rect x="47" y="20" width="5" height="48" rx="2.5" fill="#5FA463"/>
    <g fill="none" stroke="#4E9456" stroke-width="3" stroke-linecap="round">
      <path d="M42 9 Q36 2 28 5"/><path d="M43 9 Q49 2 57 4"/><path d="M50 21 Q57 15 64 17"/>
    </g>
    </g>
    <g id="g-palm">
    <path d="M42 54 C38 36 30 28 16 26 C30 35 36 42 42 54Z" fill="#3E8E57"/>
    <path d="M42 54 C46 36 54 28 68 26 C54 35 48 42 42 54Z" fill="#4C9A5C"/>
    <path d="M42 54 C36 42 28 40 20 42 C30 44 36 48 42 54Z" fill="#2F7D4F"/>
    <path d="M42 54 C48 42 56 40 64 42 C54 44 48 48 42 54Z" fill="#2F7D4F"/>
    <path d="M42 54 C38 34 40 20 42 8 C44 20 46 34 42 54Z" fill="#4C9A5C"/>
    </g>
    <!-- 담는 그릇: 물형은 유리병, 흙형은 화분 -->
    <g id="c-vase">
    <rect x="25" y="50" width="34" height="28" rx="7" fill="#D6EBF5" fill-opacity=".75" stroke="#9CC9DE" stroke-width="1.5"/>
    <rect x="26" y="58" width="32" height="19" rx="6" fill="#A9D6EA" fill-opacity=".7"/>
    </g>
    <g id="c-pot-cream">
    <path d="M27 56 H57 L54.5 76 Q54.3 78 52.3 78 H31.7 Q29.7 78 29.5 76 Z" fill="#EFE8DA"/>
    <rect x="24" y="52" width="36" height="7" rx="3" fill="#E2D8C3"/>
    </g>
    <g id="c-pot-terra">
    <path d="M27 56 H57 L54.5 76 Q54.3 78 52.3 78 H31.7 Q29.7 78 29.5 76 Z" fill="#C9714B"/>
    <rect x="24" y="52" width="36" height="7" rx="3" fill="#B8613D"/>
    </g>
    <g id="c-pot-gray">
    <path d="M27 56 H57 L54.5 76 Q54.3 78 52.3 78 H31.7 Q29.7 78 29.5 76 Z" fill="#9DB3BF"/>
    <rect x="24" y="52" width="36" height="7" rx="3" fill="#8AA2AF"/>
    </g>
  </defs>
  <symbol id="p-monstera-water" viewBox="0 0 84 84"><use href="#g-monstera"/><use href="#c-vase"/></symbol>
  <symbol id="p-monstera-soil" viewBox="0 0 84 84"><use href="#g-monstera"/><use href="#c-pot-cream"/></symbol>
  <symbol id="p-hanra-water" viewBox="0 0 84 84"><use href="#g-hanra"/><use href="#c-vase"/></symbol>
  <symbol id="p-hanra-soil" viewBox="0 0 84 84"><use href="#g-hanra"/><use href="#c-pot-terra"/></symbol>
  <symbol id="p-bamboo-water" viewBox="0 0 84 84"><use href="#g-bamboo"/><use href="#c-vase"/></symbol>
  <symbol id="p-bamboo-soil" viewBox="0 0 84 84"><use href="#g-bamboo"/><use href="#c-pot-cream"/></symbol>
  <symbol id="p-palm-water" viewBox="0 0 84 84"><use href="#g-palm"/><use href="#c-vase"/></symbol>
  <symbol id="p-palm-soil" viewBox="0 0 84 84"><use href="#g-palm"/><use href="#c-pot-gray"/></symbol>
</svg>

<!-- 시작 -->
<div class="view" id="view-start">
  <main class="screen">
    <header class="top">
      <b class="store-name"></b>
      <span id="today"></span>
    </header>

    <h1>내 띠로 보는<br>오늘의 운세와<br><em>나를 닮은 식물</em></h1>
    <p class="sub">출생연도만 고르면 바로 확인할 수 있어요.</p>

    <!-- 카드는 content/plants.json으로 자동 생성됩니다 (오른쪽에서 왼쪽으로 흐르고, 터치로 좌우로 움직일 수 있어요) -->
    <div class="marquee" id="marquee">
      <ul class="track" id="plants"></ul>
    </div>
  </main>
  <div class="bar">
    <div class="bar-inner">
      <button class="cta" id="start" type="button">내 식물 찾으러 가기</button>
      <p class="note">입력한 내용은 저장되지 않아요</p>
    </div>
  </div>
</div>

<!-- 출생연도 -->
<div class="view" id="view-year" hidden>
  <main class="screen">
    <header class="top">
      <button class="back" type="button" data-back></button>
      <b class="store-name"></b>
    </header>
    <h1 id="year-title" tabindex="-1"></h1>
    <p class="sub" id="year-sub"></p>
    <div class="date-row">
      <select class="date-select year" id="year" aria-label="연도"></select>
      <select class="date-select" id="month" aria-label="월"></select>
      <select class="date-select" id="day" aria-label="일"></select>
    </div>
  </main>
  <div class="bar">
    <div class="bar-inner">
      <button class="cta" id="year-next" type="button" disabled></button>
    </div>
  </div>
</div>

<!-- 질문 (내용은 content/questions.json에서 채웁니다) -->
<div class="view" id="view-question" hidden>
  <main class="screen">
    <header class="top">
      <button class="back" type="button" data-back></button>
      <span id="progress"></span>
    </header>
    <h1 id="q-title" tabindex="-1"></h1>
    <div class="choices" id="choices"></div>
  </main>
</div>

<!-- 결과 -->
<div class="view" id="view-result" hidden>
  <main class="screen">
    <header class="top">
      <b class="store-name"></b>
      <button class="text-btn" type="button" id="restart"></button>
    </header>
    <p class="sub" id="r-heading"></p>
    <section class="hero">
      <svg aria-hidden="true"><use id="r-icon" href=""></use></svg>
      <p class="modifier" id="r-modifier"></p>
      <h1 id="r-name" tabindex="-1"></h1>
      <span class="tag" id="r-tag"></span>
    </section>
    <p class="body-text" id="r-intro"></p>
    <p class="body-text soft" id="r-typeline"></p>
    <p class="body-text" id="r-zodiac"></p>
    <section class="fortune">
      <h2 id="f-title"></h2>
      <p class="f-line" id="f-line"></p>
      <dl>
        <div><dt id="f-color-label"></dt><dd id="f-color"></dd></div>
        <div><dt id="f-time-label"></dt><dd id="f-time"></dd></div>
        <div><dt id="f-score-label"></dt><dd id="f-score"></dd></div>
      </dl>
    </section>
    <section class="deal">
      <strong id="deal-title"></strong>
      <p id="deal-body"></p>
    </section>
  </main>
  <div class="bar">
    <div class="bar-inner">
      <button class="cta" id="browse" type="button"></button>
      <p class="note" id="browse-note" hidden></p>
    </div>
  </div>
</div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
