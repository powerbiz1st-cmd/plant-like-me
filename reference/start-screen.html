<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나를 닮은 식물</title>

<!-- 카톡 공유 미리보기: 나중에 식물별 이미지 주소로 바꿉니다 -->
<meta property="og:title" content="내 띠로 보는 오늘의 운세와 나를 닮은 식물">
<meta property="og:description" content="출생연도만 고르면 바로 확인할 수 있어요.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">

<style>
/* ── 디자인 토큰: 색과 크기는 여기서만 바꿉니다 ── */
:root {
  --bg: #F1F5F2;
  --card: #FFFFFF;
  --ink: #191F28;
  --ink-soft: #5B6573;
  --accent: #17794E;
  --water-bg: #E3F1F8;  --water-ink: #1D5F7A;
  --soil-bg: #F6ECE4;   --soil-ink: #8A4A2A;
  --radius-card: 20px;
  --radius-btn: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

/* 화면 폭: 휴대폰 기준, 큰 화면에서는 가운데 정렬 */
.screen {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: 0 20px calc(120px + env(safe-area-inset-bottom));
}
.top { display: flex; justify-content: space-between; align-items: center; height: 52px; font-size: 14px; color: var(--ink-soft); }
.top b { font-size: 15px; color: var(--ink); }
h1 { margin: 20px 0 12px; font-size: 32px; line-height: 1.3; letter-spacing: -0.02em; }
h1 em { font-style: normal; color: var(--accent); }
.sub { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink-soft); }

.plants { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 24px; padding: 0; list-style: none; }
.plant { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 12px; background: var(--card); border-radius: var(--radius-card); }
.plant svg { width: 84px; height: 84px; }
.plant strong { font-size: 16px; }
.tag { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.tag.water { background: var(--water-bg); color: var(--water-ink); }
.tag.soil  { background: var(--soil-bg);  color: var(--soil-ink); }

/* 하단 고정 버튼 */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 16px 20px calc(28px + env(safe-area-inset-bottom));
  background: var(--bg);
}
.bar-inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cta { width: 100%; height: 56px; border: 0; border-radius: var(--radius-btn); background: var(--accent); color: #fff; font: 700 17px inherit; font-family: inherit; cursor: pointer; }
.cta:active { transform: scale(.98); }
.cta:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.note { margin: 0; font-size: 13px; color: var(--ink-soft); }
</style>
</head>

<body>
<!-- 식물 그림은 한 번만 정의해 두고 카드에서 가져다 씁니다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="p-monstera" viewBox="0 0 84 84">
    <g fill="none" stroke="#3E7A52" stroke-width="2.5" stroke-linecap="round">
      <path d="M42 54 Q40 42 28 32"/><path d="M42 54 Q44 40 56 28"/><path d="M42 54 Q42 38 42 25"/>
    </g>
    <g transform="translate(27 29) rotate(-35) scale(1.05)"><path id="leaf" d="M0 -12 C-10 -6 -14 4 -7 9 C-3 12 0 8 0 5 C0 8 3 12 7 9 C14 4 10 -6 0 -12Z" fill="#2F7D4F"/></g>
    <g transform="translate(57 25) rotate(32) scale(1.05)"><path d="M0 -12 C-10 -6 -14 4 -7 9 C-3 12 0 8 0 5 C0 8 3 12 7 9 C14 4 10 -6 0 -12Z" fill="#3A9360"/></g>
    <g transform="translate(42 20) scale(1.2)"><path d="M0 -12 C-10 -6 -14 4 -7 9 C-3 12 0 8 0 5 C0 8 3 12 7 9 C14 4 10 -6 0 -12Z" fill="#2A6F46"/></g>
    <path d="M27 56 H57 L54.5 76 Q54.3 78 52.3 78 H31.7 Q29.7 78 29.5 76 Z" fill="#EFE8DA"/>
    <rect x="24" y="52" width="36" height="7" rx="3" fill="#E2D8C3"/>
  </symbol>
  <symbol id="p-hanra" viewBox="0 0 84 84">
    <g fill="none" stroke="#2F7048" stroke-width="3.2" stroke-linecap="round">
      <path d="M42 54 L18 36"/><path d="M42 54 L66 36"/><path d="M42 54 L25 22"/><path d="M42 54 L59 22"/>
      <path d="M42 54 L33 14"/><path d="M42 54 L51 14"/><path d="M42 54 L42 10"/>
    </g>
    <path d="M27 56 H57 L54.5 76 Q54.3 78 52.3 78 H31.7 Q29.7 78 29.5 76 Z" fill="#C9714B"/>
    <rect x="24" y="52" width="36" height="7" rx="3" fill="#B8613D"/>
  </symbol>
  <symbol id="p-bamboo" viewBox="0 0 84 84">
    <rect x="33" y="16" width="5" height="52" rx="2.5" fill="#5FA463"/>
    <rect x="40" y="8" width="5" height="60" rx="2.5" fill="#4E9456"/>
    <rect x="47" y="20" width="5" height="48" rx="2.5" fill="#5FA463"/>
    <g fill="none" stroke="#4E9456" stroke-width="3" stroke-linecap="round">
      <path d="M42 9 Q36 2 28 5"/><path d="M43 9 Q49 2 57 4"/><path d="M50 21 Q57 15 64 17"/>
    </g>
    <rect x="25" y="50" width="34" height="28" rx="7" fill="#D6EBF5" fill-opacity=".75" stroke="#9CC9DE" stroke-width="1.5"/>
    <rect x="26" y="58" width="32" height="19" rx="6" fill="#A9D6EA" fill-opacity=".7"/>
  </symbol>
  <symbol id="p-palm" viewBox="0 0 84 84">
    <path d="M42 54 C38 36 30 28 16 26 C30 35 36 42 42 54Z" fill="#3E8E57"/>
    <path d="M42 54 C46 36 54 28 68 26 C54 35 48 42 42 54Z" fill="#4C9A5C"/>
    <path d="M42 54 C36 42 28 40 20 42 C30 44 36 48 42 54Z" fill="#2F7D4F"/>
    <path d="M42 54 C48 42 56 40 64 42 C54 44 48 48 42 54Z" fill="#2F7D4F"/>
    <path d="M42 54 C38 34 40 20 42 8 C44 20 46 34 42 54Z" fill="#4C9A5C"/>
    <path d="M27 56 H57 L54.5 76 Q54.3 78 52.3 78 H31.7 Q29.7 78 29.5 76 Z" fill="#9DB3BF"/>
    <rect x="24" y="52" width="36" height="7" rx="3" fill="#8AA2AF"/>
  </symbol>
</svg>

<main class="screen" id="screen-start">
  <header class="top">
    <b>[가게 이름]</b>
    <span id="today"></span>
  </header>

  <h1>내 띠로 보는<br>오늘의 운세와<br><em>나를 닮은 식물</em></h1>
  <p class="sub">출생연도만 고르면 바로 확인할 수 있어요.</p>

  <!-- 카드는 아래 PLANTS 데이터로 자동 생성됩니다 -->
  <ul class="plants" id="plants"></ul>
</main>

<div class="bar">
  <div class="bar-inner">
    <button class="cta" id="start" type="button">내 식물 찾으러 가기</button>
    <p class="note">입력한 내용은 저장되지 않아요</p>
  </div>
</div>

<script>
/* ── 데이터: 식물이 바뀌면 이 목록만 고칩니다 ── */
var PLANTS = [
  { id: 'monstera', name: '몬스테라',   type: 'water' },
  { id: 'hanra',    name: '나한송',     type: 'soil'  },
  { id: 'bamboo',   name: '개운죽',     type: 'water' },
  { id: 'palm',     name: '테이블야자', type: 'soil'  }
];
var TYPE_LABEL = { water: '물형', soil: '흙형' };

/* 오늘 날짜 표시 */
var now = new Date();
document.getElementById('today').textContent =
  (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + '일월화수목금토'.charAt(now.getDay()) + '요일';

/* 식물 카드 만들기 */
var list = document.getElementById('plants');
PLANTS.forEach(function (p) {
  var li = document.createElement('li');
  li.className = 'plant';
  li.innerHTML =
    '<svg aria-hidden="true"><use href="#p-' + p.id + '"></use></svg>' +
    '<strong>' + p.name + '</strong>' +
    '<span class="tag ' + p.type + '">' + TYPE_LABEL[p.type] + '</span>';
  list.appendChild(li);
});

/* 시작 버튼: 다음 화면(출생연도 선택)을 연결하는 자리 */
document.getElementById('start').addEventListener('click', function () {
  // 다음 단계에서: 시작 화면을 숨기고 출생연도 화면을 보여줍니다.
  // 분석 이벤트도 여기서 보냅니다(입력값은 보내지 않음): gtag('event', 'start');
  console.log('다음 화면으로');
});
</script>
</body>
</html>
